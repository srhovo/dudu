<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>养成系club</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f8f7fa;
            color:#333;
            min-height:100vh;
            padding-bottom:80px;
        }
        .app-wrap{
            max-width:720px;
            margin:0 auto;
            background:#fff;
            min-height:100vh;
            position:relative;
        }
        /*左上角问好按钮*/
        .help-btn{
            position:fixed;
            left:max(16px, calc(50vw - 360px +16px));
            top:16px;
            z-index:99;
            background:#ffe6ef;
            border:none;
            width:42px;
            height:42px;
            border-radius:50%;
            font-size:20px;
            box-shadow:0 2px 8px #00000022;
        }
        /*弹窗遮罩*/
        .modal-mask{
            position:fixed;
            inset:0;
            background:#00000060;
            z-index:100;
            display:none;
            align-items:center;
            justify-content:center;
            padding:20px;
        }
        .modal-mask.show{
            display:flex;
        }
        .modal-card{
            width:100%;
            max-width:520px;
            background:#fff;
            border-radius:18px;
            padding:24px;
            max-height:85vh;
            overflow-y:auto;
        }
        .modal-close{
            margin-top:16px;
            width:100%;
            padding:12px;
            border-radius:12px;
            border:none;
            background:#f4c8d8;
            font-size:16px;
        }
        /*club标题区域*/
        .club-header-wrap{
            width:100%;
            padding:12px 16px;
        }
        .club-logo-img{
            width:100%;
            display:block;
            aspect-ratio:5/3;
            object-fit:contain;
        }
        .club-logo-text{
            text-align:center;
            font-family:"ZCOOL KuaiLe",cursive;
            font-size:32px;
            color:#d878a1;
        }
        /*分路按钮组*/
        .lane-group{
            padding:8px 16px;
            display:flex;
            gap:8px;
            flex-wrap:wrap;
        }
        .lane-btn{
            padding:8px 14px;
            border-radius:999px;
            border:1px solid #e2d8e8;
            background:#f7f2fa;
        }
        .lane-btn.active{
            background:#d8b8e8;
            color:#fff;
            border-color:#c49cd8;
        }
        /*价格筛选栏*/
        .price-filter-wrap{
            padding:10px 16px;
            overflow-x:auto;
        }
        .price-scroll{
            display:flex;
            gap:8px;
            width:max-content;
        }
        .price-tag{
            padding:7px 12px;
            border-radius:8px;
            border:1px solid #ddd;
            white-space:nowrap;
        }
        .price-tag.active{
            background:#b884d8;
            color:white;
            border-color:#a068c4;
        }
        /*陪玩双列卡片*/
        .card-grid{
            padding:12px 12px;
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:14px;
        }
        .play-card{
            background:#fff;
            border-radius:14px;
            overflow:hidden;
            box-shadow:0 1px 6px #00000015;
        }
        .card-img-wrap{
            width:100%;
            aspect-ratio:5/3;
        }
        .card-img{
            width:100%;
            height:100%;
            display:block;
            object-fit:contain;
        }
        .card-info{
            padding:8px 10px;
        }
        .card-name{
            font-weight:bold;
            font-size:15px;
        }
        .card-meta{
            font-size:13px;
            color:#777;
        }
        /*视频弹窗*/
        .video-modal video{
            width:100%;
            aspect-ratio:5/3;
            display:block;
            border-radius:12px;
        }
        /*服务页面图片占位*/
        .service-grid{
            padding:16px;
            display:flex;
            flex-direction:column;
            gap:20px;
        }
        .service-item-wrap{
            width:100%;
            border:2px dashed #dcd2e2;
            border-radius:14px;
        }
        .service-img{
            width:100%;
            aspect-ratio:5/3;
            display:block;
            object-fit:contain;
        }
        .service-tip{
            text-align:center;
            padding:30px 0;
            color:#aaa;
            aspect-ratio:5/3;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        /*管理层页面*/
        .manager-wrap{
            padding:20px 16px;
        }
        .manager-card{
            background:#f7f2fa;
            border-radius:12px;
            padding:14px;
            margin-bottom:12px;
        }
        .wx-copy{
            margin-top:6px;
            background:#e8dcf0;
            padding:10px;
            border-radius:8px;
            cursor:pointer;
        }
        .tip-text{
            margin-top:24px;
            color:#666;
            line-height:1.6;
        }
        /*搜索页*/
        .search-page h2{
            font-family:"ZCOOL KuaiLe",cursive;
            text-align:center;
            font-size:28px;
            color:#d878a1;
            padding:16px 0;
        }
        .search-input{
            width:calc(100% - 32px);
            margin:0 16px;
            padding:12px;
            border-radius:10px;
            border:1px solid #ddd;
            font-size:16px;
        }
        /*底部tab导航*/
        .tab-bar{
            position:fixed;
            bottom:0;
            left:50%;
            transform:translateX(-50%);
            max-width:720px;
            width:100%;
            background:#ffffff;
            display:flex;
            border-top:1px solid #eee;
            z-index:80;
        }
        .tab-item{
            flex:1;
            text-align:center;
            padding:12px 4px;
            font-size:14px;
        }
        .tab-item.active{
            color:#b068d4;
        }
        /*页面视图*/
        .page{
            display:none;
        }
        .page.active{
            display:block;
        }
        .toast{
            position:fixed;
            left:50%;
            top:40%;
            transform:translate(-50%,-50%);
            background:#222222cc;
            color:white;
            padding:10px 20px;
            border-radius:8px;
            z-index:200;
            display:none;
        }
    </style>
</head>
<body>
<div class="app-wrap">
    <button class="help-btn" id="helpBtn">🎀</button>

    <!--注意事项弹窗-->
    <div class="modal-mask" id="noticeModal">
        <div class="modal-card">
            <h3 style="text-align:center;margin-bottom:16px;">🎀注意事项𝜗𝜚˚⋆𓈈 𐙚 ̊˚⋆𓈈</h3>
            <div style="line-height:1.8;">
                <p>1.双轨结算取低&nbsp;&nbsp;小时单全段位无溢价</p>
                <p>2.最后结算以同车最高🌟板宝为准</p>
                <p>3.养成系支持混团组车，但需他团陪玩至少为技术级别以上o！</p>
                <p>4.游戏中宝宝若出现挂机、中途退出，输赢全结</p>
                <p>5.若强制陪玩选择非主玩分路及不常用英雄，输赢全结</p>
            </div>
            <button class="modal-close" id="closeNotice">关闭</button>
        </div>
    </div>

    <!--视频播放弹窗-->
    <div class="modal-mask" id="videoModal">
        <div class="modal-card video-modal">
            <video id="playVideo" controls></video>
            <div id="videoName" style="text-align:center;margin:10px 0;"></div>
            <button class="modal-close" id="closeVideo">关闭</button>
        </div>
    </div>

    <!--toast提示-->
    <div class="toast" id="toast"></div>

    <!--page1挑选陪玩-->
    <div class="page active" id="page1">
        <div class="club-header-wrap" id="clubHeader"></div>
        <div class="lane-group" id="laneWrap"></div>
        <div class="price-filter-wrap">
            <div class="price-scroll" id="priceWrap"></div>
        </div>
        <div class="card-grid" id="cardWrap"></div>
    </div>

    <!--page2服务清单-->
    <div class="page" id="page2">
        <div class="service-grid" id="serviceWrap"></div>
    </div>

    <!--page3搜索-->
    <div class="page" id="page3">
        <div class="search-page">
            <h2>养成系club</h2>
            <input class="search-input" id="searchInput" placeholder="输入名字/拼音首字母搜索">
            <div class="card-grid" id="searchResult"></div>
        </div>
    </div>

    <!--page4管理层信息-->
    <div class="page" id="page4">
        <div class="manager-wrap">
            <div class="manager-card">
                <div>团长 - 嘟嘟</div>
                <div class="wx-copy" data-wx="keke-aoo">微信号：keke-aoo （点击复制）</div>
            </div>
            <div class="manager-card">
                <div>副团 - 小翎</div>
                <div class="wx-copy" data-wx="_Elysia0304">微信号：_Elysia0304 （点击复制）</div>
            </div>
            <div class="manager-card">
                <div>管理 - 小忆</div>
                <div class="wx-copy" data-wx="YIk-xjw-fno4u">微信号：YIk-xjw-fno4u （点击复制）</div>
            </div>
            <p class="tip-text">☁️有任何问题都可以向管理层询问，我们会竭力保证宝宝们的游戏体验</p>
        </div>
    </div>

    <!--底部tab栏-->
    <div class="tab-bar">
        <div class="tab-item active" data-page="page1">挑选陪玩</div>
        <div class="tab-item" data-page="page2">服务清单</div>
        <div class="tab-item" data-page="page3">搜索</div>
        <div class="tab-item" data-page="page4">管理层</div>
    </div>
</div>

<script src="./data.js"></script>
<script>
//渲染club标题
async function renderClubHeader(){
    const headerDom = document.getElementById('clubHeader');
    const tryList = ['assets/club-logo.png','assets/club-logo.jpg','assets/club-logo.jpeg','assets/club-logo.webp'];
    let ok = false;
    for(let src of tryList){
        try{
            const res = await fetch(src,{method:"HEAD"});
            if(res.ok){
                headerDom.innerHTML = `<img class="club-logo-img" src="${src}" alt="club标题">`;
                ok=true;
                break;
            }
        }catch(e){}
    }
    if(!ok){
        headerDom.innerHTML = `<div class="club-logo-text">养成系club</div>`;
    }
}

//渲染服务页面
async function renderServicePage(){
    const wrap = document.getElementById('serviceWrap');
    const serviceFiles = [
        {name:"价格表",file:"assets/services/price.png"},
        {name:"预存表",file:"assets/services/prepaid.png"},
        {name:"礼物单",file:"assets/services/gift.png"},
        {name:"活动图",file:"assets/services/activity.png"},
    ];
    let html = "";
    for(let item of serviceFiles){
        let hasFile = false;
        try{
            const resp = await fetch(item.file,{method:'HEAD'});
            if(resp.ok) hasFile=true;
        }catch(e){}
        if(hasFile){
            html += `
            <div class="service-item-wrap">
                <img class="service-img" src="${item.file}" alt="${item.name}">
            </div>`
        }else{
            html += `
            <div class="service-item-wrap">
                <div class="service-tip">${item.name} 待上传图片</div>
            </div>`
        }
    }
    wrap.innerHTML = html;
}

//渲染分路按钮
function renderLane(){
    const laneWrap = document.getElementById('laneWrap');
    let html = `<button class="lane-btn active" data-lane="all">全部分路</button>`;
    window.lanes.forEach(l=>{
        html += `<button class="lane-btn" data-lane="${l}">${l}</button>`
    })
    laneWrap.innerHTML = html;
}

//渲染价格筛选
function renderPrice(){
    const pWrap = document.getElementById('priceWrap');
    let html = `<span class="price-tag active" data-price="all">全部(${getCount("all","all")})</span>`;
    window.prices.forEach(p=>{
        html += `<span class="price-tag" data-price="${p}">${p}r(${getCount(p,"all")})</span>`
    })
    pWrap.innerHTML = html;
}

//统计数量
function getCount(price,lane){
    return window.companions.filter(c=>{
        const matchPrice = price==="all" || c.price === price;
        const matchLane = lane==="all" || c.lanes.includes(lane);
        return matchPrice && matchLane;
    }).length
}

let curPrice = "all";
let curLane = "all";

//渲染卡片列表
function renderCards(){
    const wrap = document.getElementById("cardWrap");
    const list = window.companions.filter(c=>{
        const mp = curPrice==="all" || c.price === curPrice;
        const ml = curLane==="all" || c.lanes.includes(curLane);
        return mp && ml;
    })
    let html = "";
    list.forEach(item=>{
        html += `
        <div class="play-card" data-video="${item.video??''}" data-name="${item.name}">
            <div class="card-img-wrap">
                <img class="card-img" src="${item.image}" alt="${item.name}">
            </div>
            <div class="card-info">
                <div class="card-name">${item.name}</div>
                <div class="card-meta">${item.price}r · ${item.lanes.join("/")}</div>
            </div>
        </div>`
    })
    wrap.innerHTML = html;
    //卡片点击事件
    document.querySelectorAll(".play-card").forEach(card=>{
        card.onclick = function(){
            const v = this.dataset.video;
            const n = this.dataset.name;
            const videoDom = document.getElementById("playVideo");
            const nameDom = document.getElementById("videoName");
            if(v){
                videoDom.src = v;
                videoDom.style.display = "block";
            }else{
                videoDom.style.display = "none";
            }
            nameDom.innerText = n;
            document.getElementById("videoModal").classList.add("show");
            if(v) videoDom.play();
        }
    })
}

//搜索功能
function searchHandle(keyword){
    const resWrap = document.getElementById("searchResult");
    if(!keyword.trim()){
        resWrap.innerHTML = "";
        return;
    }
    const kw = keyword.toLowerCase();
    const result = window.companions.filter(c=>{
        const fullText = (c.name +" "+ c.pinyin +" "+c.shortPy).toLowerCase();
        return fullText.includes(kw);
    })
    let html = "";
    result.forEach(item=>{
        html += `
        <div class="play-card" data-video="${item.video??''}" data-name="${item.name}">
            <div class="card-img-wrap">
                <img class="card-img" src="${item.image}" alt="${item.name}">
            </div>
            <div class="card-info">
                <div class="card-name">${item.name}</div>
                <div class="card-meta">${item.price}r · ${item.lanes.join("/")}</div>
            </div>
        </div>`
    })
    resWrap.innerHTML = html;
    //搜索结果卡片点击
    document.querySelectorAll("#searchResult .play-card").forEach(card=>{
        card.onclick = function(){
            const v = this.dataset.video;
            const n = this.dataset.name;
            const videoDom = document.getElementById("playVideo");
            const nameDom = document.getElementById("videoName");
            if(v){
                videoDom.src = v;
                videoDom.style.display = "block";
            }else{
                videoDom.style.display = "none";
            }
            nameDom.innerText = n;
            document.getElementById("videoModal").classList.add("show");
            if(v) videoDom.play();
        }
    })
}

//toast弹窗
function showToast(msg){
    const t = document.getElementById("toast");
    t.innerText = msg;
    t.style.display="block";
    setTimeout(()=>t.style.display="none",1800);
}

//页面tab切换
document.querySelectorAll(".tab-item").forEach(tab=>{
    tab.onclick = function(){
        const targetPage = this.dataset.page;
        document.querySelectorAll(".tab-item").forEach(i=>i.classList.remove("active"));
        document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
        this.classList.add("active");
        document.getElementById(targetPage).classList.add("active");
    }
})

//事件绑定
document.getElementById("helpBtn").onclick = function(){
    document.getElementById("noticeModal").classList.add("show");
}
document.getElementById("closeNotice").onclick = function(){
    document.getElementById("noticeModal").classList.remove("show");
}
document.getElementById("closeVideo").onclick = function(){
    const v = document.getElementById("playVideo");
    v.pause();
    document.getElementById("videoModal").classList.remove("show");
}

//复制微信号
document.querySelectorAll(".wx-copy").forEach(el=>{
    el.onclick = async function(){
        const wx = this.dataset.wx;
        try{
            await navigator.clipboard.writeText(wx);
            showToast("已复制微信号");
        }catch(e){
            showToast("复制失败，请手动复制");
        }
    }
})

//分路筛选点击
document.addEventListener("click",e=>{
    if(e.target.classList.contains("lane-btn")){
        document.querySelectorAll(".lane-btn").forEach(b=>b.classList.remove("active"));
        e.target.classList.add("active");
        curLane = e.target.dataset.lane;
        renderPrice();
        renderCards();
    }
})
//价格筛选点击
document.addEventListener("click",e=>{
    if(e.target.classList.contains("price-tag")){
        document.querySelectorAll(".price-tag").forEach(b=>b.classList.remove("active"));
        e.target.classList.add("active");
        curPrice = e.target.dataset.price;
        renderCards();
    }
})

//搜索输入
document.getElementById("searchInput").addEventListener("input",function(e){
    searchHandle(e.target.value)
})

//初始化
async function init(){
    await renderClubHeader();
    await renderServicePage();
    renderLane();
    renderPrice();
    renderCards();
}
window.onload = init;
</script>
</body>
</html>
